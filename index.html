<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#111315">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="책 스캐너">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>책 스캐너</title>
<style>
:root{--bg:#111315;--surf:#1d2023;--ink:#f2f4f5;--mute:#8d969c;--line:#2d3236;--acc:#f3c340;--tl:#12b79b;--tlink:#04201a;--glass:rgba(255,255,255,.13);color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f5f7;--surf:#fff;--ink:#14202b;--mute:#5d6b78;--line:#d5dce2;--acc:#a87400;--tl:#0a8f78;--tlink:#fff;--glass:rgba(0,0,0,.07);color-scheme:light}}
:root[data-theme="light"]{--bg:#f3f5f7;--surf:#fff;--ink:#14202b;--mute:#5d6b78;--line:#d5dce2;--acc:#a87400;--tl:#0a8f78;--tlink:#fff;--glass:rgba(0,0,0,.07);color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
button,.btn,select,input{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--surf);padding:10px 14px;border-radius:12px;cursor:pointer;min-height:44px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.pri{background:var(--tl);border-color:var(--tl);color:var(--tlink);font-weight:700}
.chip[aria-pressed="true"]{border-color:var(--acc);color:var(--acc);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.screen{display:none}
body[data-s=cam] #sCam{display:flex}
body[data-s=lib] #sLib,body[data-s=fold] #sFold,body[data-s=stage] #sStage{display:block}
.pg{max-width:640px;margin:0 auto;padding:12px 16px 110px;min-height:100%}
.hd{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.hd h1{flex:1;text-align:center;font-size:18px;margin:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd .sp{width:96px}
.pill{border-radius:999px;background:var(--glass);border-color:transparent;padding:8px 16px}
.sec h2{font-size:15px;color:var(--mute);margin:20px 0 10px;font-weight:600}
.hs{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.rc{flex:none;width:112px;padding:0;border-radius:10px;overflow:hidden;background:var(--surf)}
.rc img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}
.fi{display:flex;gap:16px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:8px 0;min-height:0}
.fth{flex:none;width:76px;height:96px;border-radius:8px;background:var(--surf);border:1px solid var(--line);overflow:hidden}
.fth img{width:100%;height:100%;object-fit:cover;display:block}
.ft strong{display:block;font-size:20px;font-weight:700}
.ft span{color:var(--mute);font-size:14px}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:20px;background:var(--tl);color:var(--tlink);font-size:30px;line-height:1;padding:0;border:0}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.th{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surf)}
.th img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}
.th span{position:absolute;left:4px;top:4px;background:var(--ink);color:var(--bg);font-size:12px;padding:0 6px;border-radius:6px}
.th button{position:absolute;right:2px;top:2px;min-height:32px;padding:0 8px;font-size:13px}
.empty{color:var(--mute);font-size:14px}
textarea#out{width:100%;margin-top:6px;padding:10px;font-size:15px;line-height:1.6;background:var(--surf);border:1px solid var(--line);border-radius:10px;resize:vertical}
textarea#out[hidden],[hidden]{display:none!important}
/* camera: always dark, like a viewfinder */
#sCam{flex-direction:column;height:100%;background:#111315;color:#f2f4f5}
#sCam .top{padding:10px 16px}
#sCam .view{position:relative;flex:1;min-height:0;background:#2a2326;overflow:hidden}
#vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.guide{position:absolute;top:56px;bottom:56px;left:50%;border-left:3px dashed rgba(255,255,255,.85);pointer-events:none}
#camMsg{position:absolute;inset:0;width:100%;border:0;border-radius:0;background:transparent;text-align:center;color:#d7dde1;font-size:17px;line-height:1.8;padding:0 24px}
.guide{position:absolute;top:0;bottom:0;left:50%;border-left:3px dashed rgba(255,255,255,.85);pointer-events:none}
.tools{position:absolute;top:0;left:0;right:0;padding:12px 20px;background:rgba(0,0,0,.35);display:flex;gap:12px}
.tools button{background:none;border:0;font-size:22px;min-width:44px;color:#fff}
.tools button[aria-pressed="true"]{color:#f3c340}
.modes{position:absolute;bottom:14px;left:0;right:0;display:flex;gap:10px;justify-content:center}
.modes button{border-radius:999px;border:0;background:rgba(40,36,38,.7);color:#d7c9cc;padding:8px 18px;font-weight:700}
.modes button[aria-pressed="true"]{background:#2b2427;color:#f3c340}
#sCam .foot{padding:12px 16px 8px;display:flex;flex-direction:column;align-items:center;gap:14px}
#fsel{appearance:none;background:#1f2326;border:0;border-radius:999px;padding:12px 28px;font-weight:700;font-size:18px;color:#f2f4f5;max-width:90%}
.srow{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:420px}
#thumb{width:72px;height:72px;padding:0;border-radius:8px;overflow:hidden;background:#1f2326;border:1px solid #333}
#thumb img{width:100%;height:100%;object-fit:cover;display:block}
#shut{width:80px;height:80px;border-radius:50%;background:#fff;border:4px solid #111315;box-shadow:0 0 0 3px #fff;padding:0}
.gal{width:72px;text-align:center;background:#1f2326;border-radius:12px;padding:12px 0;cursor:pointer;font-size:14px;color:#f2f4f5}
canvas#ed{display:block;margin:0 auto;border-radius:8px;touch-action:none;background:#000;max-width:100%}
.hint{color:var(--mute);font-size:14px;margin:8px 0}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sh{background:var(--surf);width:100%;max-width:640px;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));border-radius:20px 20px 0 0}
.sh input{display:block;width:100%;margin-top:8px;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px}
#msg{position:fixed;left:16px;right:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));margin:0 auto;max-width:480px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;text-align:center;z-index:6}
.th .tb{display:flex;border-top:1px solid var(--line)}
.th .tb button{position:static;flex:1;min-height:40px;padding:0;border:0;border-radius:0;background:none;font-size:16px}
.th .tb button:disabled{opacity:.3}
.th img{cursor:zoom-in}
#vw{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;color:#f2f4f5}
#vw img{max-width:100%;max-height:76%;object-fit:contain;background:#fff;border-radius:4px}
#vw button{background:#2a2e31;border-color:#444;color:#f2f4f5}
.th .sgb{right:auto;top:auto;left:2px;bottom:2px}
#sig{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:5}
#sig .sh{max-height:100%;overflow:auto}
#pv{display:block;margin:0 auto;max-width:100%;border-radius:6px;touch-action:none;background:#fff}
#pad{display:block;width:100%;aspect-ratio:3/1;border:1px dashed var(--mute);border-radius:8px;touch-action:none;background:#fff}
.tools #autoB{font-size:14px;font-weight:700}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
</style>
</head>
<body data-s="cam">

<section id="sCam" class="screen">
  <div class="top"><button class="pill" id="toLib" style="color:#f2f4f5">📁 라이브러리</button></div>
  <div class="view">
    <video id="vid" autoplay playsinline muted></video>
    <canvas id="ov"></canvas>
    <div id="guide" class="guide" hidden></div>
    <button id="camMsg" hidden>카메라 미리보기를 쓸 수 없어요.<br>여기를 눌러 기기 카메라로 촬영하세요.</button>
    <div class="tools"><button id="flash" aria-pressed="false" aria-label="플래시">⚡</button><button id="autoB" aria-pressed="false" aria-label="자동 촬영">AUTO</button></div>
    <div class="modes" id="modes">
      <button data-m="1" aria-pressed="false">1 페이지</button>
      <button data-m="2" aria-pressed="false">2 페이지</button>
      <button data-m="a" aria-pressed="true">자동 인식</button>
    </div>
  </div>
  <div class="foot">
    <select id="fsel" aria-label="저장할 폴더"></select>
    <div class="srow">
      <button id="thumb" aria-label="최근 스캔 보기"></button>
      <button id="shut" aria-label="촬영"></button>
      <label class="gal" tabindex="0">사진<input id="gal" type="file" accept="image/*" hidden></label>
    </div>
  </div>
  <input id="camfile" type="file" accept="image/*" capture="environment" hidden>
</section>

<section id="sLib" class="screen pg">
  <header class="hd"><button class="pill" id="backCam">‹ 카메라</button><h1>모든 폴더</h1><span class="sp"></span></header>
  <div id="recentWrap"><div class="sec"><h2>최근</h2></div><div id="recent" class="hs"></div></div>
  <div class="sec"><h2 id="fcount"></h2></div>
  <div id="flist"></div>
  <button id="newF" class="fab" aria-label="새 폴더 만들기">＋</button>
</section>

<section id="sFold" class="screen pg">
  <header class="hd"><button class="pill" id="backLib">‹ 라이브러리</button><h1 id="ftitle"></h1><span class="sp"></span></header>
  <p id="emptyMsg" class="empty">아직 스캔한 페이지가 없습니다. 카메라에서 촬영해 보세요.</p>
  <div id="grid"></div>
  <div class="row"><button id="pdf" class="pri" disabled>PDF로 저장</button><button id="ocr" disabled>텍스트 추출 (OCR)</button></div>
  <div class="row"><button id="imgs" disabled>이미지 공유</button><button id="word" disabled>Word로 저장</button><button id="pdfimp">PDF 가져오기</button></div>
  <input id="pdfin" type="file" accept="application/pdf" hidden>
  <textarea id="out" hidden rows="10" aria-label="추출된 텍스트"></textarea>
  <div class="row"><button id="cpy">텍스트 복사</button><button id="txt">TXT로 저장</button></div>
  <div class="row"><button id="renF">폴더 이름 변경</button><button id="clear" disabled>페이지 모두 지우기</button><button id="delFold">폴더 삭제</button></div>
</section>

<section id="sStage" class="screen pg">
  <canvas id="ed"></canvas>
  <p class="hint">파란 점은 모서리, 주황 점은 윗변·아랫변의 휘어진 정도를 맞춥니다. 점을 끌어 페이지 경계에 맞추세요.</p>
  <div class="row"><button id="auto">자동 감지</button><button id="more" class="chip" aria-pressed="false">더 펴기 (좌우 곡선)</button><button id="flatB" class="chip" aria-pressed="true">글줄 펴기</button><button id="rot">90° 회전</button></div>
  <div class="row" id="filters">
    <button class="chip" data-f="orig" aria-pressed="false">원본</button>
    <button class="chip" data-f="clean" aria-pressed="true">선명하게</button>
    <button class="chip" data-f="gray" aria-pressed="false">회색조</button>
    <button class="chip" data-f="bw" aria-pressed="false">흑백</button>
    <button class="chip" data-f="erase" aria-pressed="false">필기 지우기</button>
  </div>
  <div class="row"><button id="add" class="pri">페이지 추가</button><button id="addNext" class="pri">추가하고 계속 촬영</button><button id="cancel">취소</button></div>
</section>

<div id="vw" hidden><img id="vwI" alt="페이지 미리보기"><div class="row"><button id="vwP">‹ 이전</button><span id="vwN" style="align-self:center"></span><button id="vwNx">다음 ›</button><button id="vwX">닫기</button></div></div>
<div id="sig" hidden><div class="sh"><canvas id="pv"></canvas><p class="hint">아래 칸에 서명한 뒤, 위 페이지에서 서명을 넣을 위치를 누르거나 끌어 맞추세요.</p><canvas id="pad" width="600" height="200"></canvas><div class="row"><button id="sgClr">서명 지우기</button><button id="sgOk" class="pri">페이지에 적용</button><button id="sgX">닫기</button></div></div></div>
<div id="sheet" hidden><div class="sh"><label for="nf">폴더 이름</label><input id="nf" maxlength="30"><div class="row"><button id="mk" class="pri">만들기</button><button id="cx">취소</button></div></div></div>
<div id="msg" role="status" hidden></div>

<script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script id="core">
/* SC: book/page scan engine. Pure JS, no deps. Runs in main thread, Web Worker and Node.
   Image type everywhere: {w,h,d:Uint8ClampedArray RGBA}.
   Page model "pts": 8 points [TL,TR,BR,BL, TM,BM,LM,RM] in image pixels (TM/BM/LM/RM = curve midpoints). */
const SC=(function(){
'use strict';
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);

/* ================= raster helpers ================= */
function shrink(img,tw,th){
  const w=img.w,h=img.h,d=img.d;tw=Math.max(1,Math.round(tw));th=Math.max(1,Math.round(th));
  if(tw>=w&&th>=h)return img;
  const out=new Uint8ClampedArray(tw*th*4),xs=new Int32Array(tw+1),ys=new Int32Array(th+1);
  for(let i=0;i<=tw;i++)xs[i]=Math.round(i*w/tw);
  for(let i=0;i<=th;i++)ys[i]=Math.round(i*h/th);
  for(let ty=0;ty<th;ty++){
    const y0=ys[ty],y1=Math.max(ys[ty+1],y0+1);
    for(let tx=0;tx<tw;tx++){
      const x0=xs[tx],x1=Math.max(xs[tx+1],x0+1);let r=0,g=0,b=0,n=0;
      for(let y=y0;y<y1;y++){let p=(y*w+x0)*4;for(let x=x0;x<x1;x++,p+=4){r+=d[p];g+=d[p+1];b+=d[p+2];n++}}
      const o=(ty*tw+tx)*4;out[o]=r/n;out[o+1]=g/n;out[o+2]=b/n;out[o+3]=255;
    }
  }
  return{w:tw,h:th,d:out};
}
function gray(img){const n=img.w*img.h,d=img.d,g=new Float32Array(n);for(let i=0,j=0;i<n;i++,j+=4)g[i]=.299*d[j]+.587*d[j+1]+.114*d[j+2];return g}
function boxBlur(src,w,h,r){
  r=Math.max(0,r|0);if(r===0)return Float32Array.from(src);
  const tmp=new Float32Array(w*h),out=new Float32Array(w*h),k=2*r+1;
  for(let y=0;y<h;y++){const o=y*w;let s=0;for(let i=-r;i<=r;i++)s+=src[o+clamp(i,0,w-1)];
    for(let x=0;x<w;x++){tmp[o+x]=s/k;s+=src[o+Math.min(w-1,x+r+1)]-src[o+Math.max(0,x-r)]}}
  for(let x=0;x<w;x++){let s=0;for(let i=-r;i<=r;i++)s+=tmp[clamp(i,0,h-1)*w+x];
    for(let y=0;y<h;y++){out[y*w+x]=s/k;s+=tmp[Math.min(h-1,y+r+1)*w+x]-tmp[Math.max(0,y-r)*w+x]}}
  return out;
}
function gauss(src,w,h,sigma){ // 3-pass box approximation
  const n=3,wi=Math.sqrt(12*sigma*sigma/n+1);let wl=Math.floor(wi);if(wl%2===0)wl--;const wu=wl+2;
  const m=Math.round((12*sigma*sigma-n*wl*wl-4*n*wl-3*n)/(-4*wl-4));
  let a=src;for(let i=0;i<n;i++)a=boxBlur(a,w,h,((i<m?wl:wu)-1)/2);return a;
}
function sobel(g,w,h){
  const gx=new Float32Array(w*h),gy=new Float32Array(w*h);
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=y*w+x,
    a=g[i-w-1],b=g[i-w],c=g[i-w+1],d=g[i-1],f=g[i+1],e=g[i+w-1],hh=g[i+w],j=g[i+w+1];
    gx[i]=(c+2*f+j-a-2*d-e)/8;gy[i]=(e+2*hh+j-a-2*b-c)/8}
  return{gx,gy};
}
function bil(f,w,h,x,y){x=clamp(x,0,w-1.001);y=clamp(y,0,h-1.001);const x0=x|0,y0=y|0,fx=x-x0,fy=y-y0,i=y0*w+x0;
  return(f[i]*(1-fx)+f[i+1]*fx)*(1-fy)+(f[i+w]*(1-fx)+f[i+w+1]*fx)*fy}
function hist256(v,n){const h=new Uint32Array(256);for(let i=0;i<n;i++){const k=v[i]|0;h[k<0?0:k>255?255:k]++}return h}
function pctl(h,total,p){let s=0;const t=p*total;for(let i=0;i<256;i++){s+=h[i];if(s>=t)return i}return 255}
function bez(p0,m,p2,t){const cx=2*m[0]-(p0[0]+p2[0])/2,cy=2*m[1]-(p0[1]+p2[1])/2,u=1-t;
  return[u*u*p0[0]+2*u*t*cx+t*t*p2[0],u*u*p0[1]+2*u*t*cy+t*t*p2[1]]}
function arcLen(p0,m,p2){let s=0,a=p0;for(let i=1;i<=16;i++){const b=bez(p0,m,p2,i/16);s+=dist(a,b);a=b}return s}

/* ================= geometry ================= */
function convexHull(P){
  P=P.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo=[];for(const p of P){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p)}
  const up=[];for(let i=P.length-1;i>=0;i--){const p=P[i];while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p)}
  lo.pop();up.pop();return lo.concat(up);
}
function lineInter(a,b,c,d){
  const r0=b[0]-a[0],r1=b[1]-a[1],s0=d[0]-c[0],s1=d[1]-c[1],den=r0*s1-r1*s0;
  if(Math.abs(den)<1e-9)return null;const t=((c[0]-a[0])*s1-(c[1]-a[1])*s0)/den;return[a[0]+t*r0,a[1]+t*r1];
}
function hullToQuad(h){ // minimal-area-gain reduction of a convex polygon to 4 vertices
  let P=h.slice();if(P.length<4)return null;
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  while(P.length>4){
    const n=P.length;let best=-1,bestA=Infinity,bp=null;
    for(let i=0;i<n;i++){
      const a=P[(i+n-1)%n],b=P[i],c=P[(i+1)%n],d=P[(i+2)%n],x=lineInter(a,b,c,d);
      if(!x)continue;if(cr(b,c,x)>=0)continue; // x must lie outside edge b-c

 if(m.op==='process'||m.op==='both'){const t=Date.now();const p=SC.process(img,m.op==='both'?r.det.pts:m.pts,m.popt||{});r.info=p.info;r.pages=p.pages.map(q=>({w:q.w,h:q.h,buf:q.d.buffer}));r.procMs=Date.now()-t}
 return r}
</script>
<script>
const $=id=>document.getElementById(id);
const ed=$('ed'),ex=ed.getContext('2d');
let src=null,disp=null,pts=[],scale=1,drag=-1,book=false,filt='clean',mode='a',stream=null;
let more=false,autoShot=false,flat=true,detP=Promise.resolve(),adding=false;
const lm=()=>pts[6],rm=()=>pts[7];
let folders=[{id:'f1',name:'기본 폴더',ts:Date.now(),pages:[]}],curId='f1',pages=folders[0].pages;
const MAXSRC=3600;
const cur=()=>folders.find(f=>f.id===curId)||folders[0];
function setCur(id){curId=id;pages=cur().pages}
let sayT=null,renId=null;
function say(t){const m=$('msg');clearTimeout(sayT);m.textContent=t;m.hidden=!t;if(t&&!/…|%$/.test(t))sayT=setTimeout(()=>{m.hidden=true},3500)}

// ---- storage (IndexedDB, per viewer; fails quietly) ----
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('scan',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej()})}
async function persist(){try{const d=await idb();await new Promise((ok,no)=>{const t=d.transaction('k','readwrite');t.objectStore('k').put(folders,'f');t.oncomplete=ok;t.onerror=t.onabort=()=>no(t.error)})}catch(e){say('저장 공간이 부족하거나 저장하지 못했습니다. PDF로 내보내 두세요.')}}
async function restore(){try{const d=await idb();await new Promise(ok=>{const r=d.transaction('k').objectStore('k').get('f');r.onsuccess=()=>{if(r.result&&r.result.length){folders=r.result;setCur(folders[0].id)}ok()};r.onerror=ok})}catch(e){}}


// ---- scan engine: Web Worker (stateless requests), main-thread fallback ----
let cw=null,wid=0;const pend=new Map();window.__perf={};
(function initWorker(){try{
  const code=document.getElementById('core').textContent+"\n;self.onmessage=function(e){const m=e.data;try{const r=scRun({w:m.w,h:m.h,d:new Uint8ClampedArray(m.buf)},m);self.postMessage({id:m.id,r:r},(r.pages||[]).map(function(q){return q.buf}))}catch(err){self.postMessage({id:m.id,err:String(err&&err.stack||err)})}};";
  cw=new Worker(URL.createObjectURL(new Blob([code],{type:'text/javascript'})));
  cw.onmessage=e=>{const p=pend.get(e.data.id);if(!p)return;pend.delete(e.data.id);e.data.err?p.rej(new Error(e.data.err)):p.res(e.data.r)};
  cw.onerror=()=>{cw=null;pend.forEach(p=>p.rej(new Error('worker')));pend.clear()};
}catch(e){cw=null}})();
function rgba(c){const id=c.getContext('2d').getImageData(0,0,c.width,c.height);return{w:c.width,h:c.height,d:id.data}}
async function callCore(op,getImg,extra){
  const msg=Object.assign({op},extra);
  if(cw){
    try{const img=getImg();return await new Promise((res,rej)=>{const id=++wid;pend.set(id,{res,rej});cw.postMessage(Object.assign({id,w:img.w,h:img.h,buf:img.d.buffer},msg),[img.d.buffer])})}
    catch(e){if(e.message!=='worker')throw e}
  }
  const img=getImg();
  return await new Promise((res,rej)=>setTimeout(()=>{try{res(scRun(img,msg))}catch(e){rej(e)}},15));
}
function pageURL(q){const c=document.createElement('canvas');c.width=q.w;c.height=q.h;c.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(q.buf),q.w,q.h),0,0);return c.toDataURL('image/jpeg',.9)}
async function toCanvas(blob){
  let bmp=null,url=null;
  try{bmp=await createImageBitmap(blob,{imageOrientation:'from-image'})}catch(e){bmp=null}
  if(!bmp){bmp=await new Promise((res,rej)=>{const im=new Image();url=URL.createObjectURL(blob);im.onload=()=>res(im);im.onerror=rej;im.src=url})}
  const iw=bmp.width,ih=bmp.height,r=Math.min(1,MAXSRC/Math.max(iw,ih));
  const c=document.createElement('canvas');c.width=Math.round(iw*r);c.height=Math.round(ih*r);
  const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(bmp,0,0,c.width,c.height);
  if(bmp.close)bmp.close();if(url)URL.revokeObjectURL(url);return c;
}

// ---- camera ----
async function startCam(){
  if(stream)return;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:3840}}});
    $('vid').srcObject=stream;$('camMsg').hidden=true;
    try{const t=stream.getVideoTracks()[0],caps=t.getCapabilities&&t.getCapabilities();
      if(caps&&caps.focusMode&&caps.focusMode.includes('continuous'))await t.applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}
  }catch(e){stream=null;$('camMsg').hidden=false}
}
function stopCam(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('vid').srcObject=null}
function go(s){document.body.dataset.s=s;say('');if(s==='cam')startCam();else if(s==='lib'||s==='fold')stopCam();if(s==='lib'||s==='fold')renderAll();window.scrollTo(0,0)}

async function load(file){
  if(!file)return;
  let c;try{c=await toCanvas(file)}catch(e){say('이미지를 열 수 없습니다. 다른 사진을 선택해 주세요.');return}
  src=c;pts=[];more=false;$('more').setAttribute('aria-pressed',false);go('stage');fit();detectNow();
}

function fit(){
  const w=Math.min(608,window.innerWidth-32),maxH=window.innerHeight*0.6;
  scale=Math.min(w/src.width,maxH/src.height);
  ed.width=Math.round(src.width*scale);ed.height=Math.round(src.height*scale);
  disp=document.createElement('canvas');disp.width=ed.width;disp.height=ed.height;
  const dx=disp.getContext('2d');dx.imageSmoothingQuality='high';dx.drawImage(src,0,0,ed.width,ed.height);
  draw();
}
window.addEventListener('resize',()=>{if(src)fit()});

// pts: 0 TL,1 TR,2 BR,3 BL,4 top-mid,5 bottom-mid (image coords)
function defaultPts(x0,y0,x1,y1){
  pts=[[x0,y0],[x1,y0],[x1,y1],[x0,y1],[(x0+x1)/2,y0],[(x0+x1)/2,y1],[x0,(y0+y1)/2],[x1,(y0+y1)/2]];
}
function applyDet(d){
  const cl=(v,m)=>Math.max(0,Math.min(m,v));
  pts=d.pts.map(p=>[cl(p[0],src.width),cl(p[1],src.height)]);
  const dg=Math.hypot(src.width,src.height),off=(a,m,b)=>Math.hypot(m[0]-(a[0]+b[0])/2,m[1]-(a[1]+b[1])/2);
  more=Math.max(off(pts[0],pts[6],pts[3]),off(pts[1],pts[7],pts[2]))>.005*dg;
  $('more').setAttribute('aria-pressed',more);
  say(!d.ok?'페이지 경계를 자동으로 찾지 못했어요. 점을 끌어 맞춰 주세요.':(d.low?'경계에 확신이 낮아요. 점을 확인하고 필요하면 끌어 맞춰 주세요.':''));
  draw();
}
function detectNow(){
  const my=src;say('윤곽선을 찾는 중…');pts=[];draw();
  detP=callCore('detect',()=>rgba(my),{dopt:{}}).then(r=>{if(src!==my)return;__perf.det=r.detMs;applyDet(r.det)})
    .catch(()=>{if(src!==my)return;const m=.05;defaultPts(src.width*m,src.height*m,src.width*(1-m),src.height*(1-m));say('자동 감지에 실패했어요. 점을 끌어 맞춰 주세요.');draw()});
  return detP;
}
$('auto').onclick=()=>{if(src)detectNow()};

const bez=(p0,m,p2,t)=>{ // quadratic curve passing through m at t=.5
  const cx=2*m[0]-(p0[0]+p2[0])/2,cy=2*m[1]-(p0[1]+p2[1])/2,u=1-t;
  return [u*u*p0[0]+2*u*t*cx+t*t*p2[0],u*u*p0[1]+2*u*t*cy+t*t*p2[1]];
};
function path(a,m,b,steps=24){
  for(let i=0;i<=steps;i++){const p=bez(a,m,b,i/steps);ex[i?'lineTo':'moveTo'](p[0]*scale,p[1]*scale)}
}
function draw(){
  if(!src||!pts.length)return;
  ex.clearRect(0,0,ed.width,ed.height);
  ex.drawImage(disp,0,0);
  const [TL,TR,BR,BL,TM,BM]=pts,LM=lm(),RM=rm();
  ex.beginPath();path(TL,TM,TR);
  for(let i=1;i<=24;i++){const p=bez(TR,RM,BR,i/24);ex.lineTo(p[0]*scale,p[1]*scale)}
  for(let i=23;i>=0;i--){const p=bez(BL,BM,BR,i/24);ex.lineTo(p[0]*scale,p[1]*scale)}
  for(let i=23;i>=0;i--){const p=bez(TL,LM,BL,i/24);ex.lineTo(p[0]*scale,p[1]*scale)}
  ex.closePath();
  ex.fillStyle='rgba(31,95,191,.14)';ex.fill();
  ex.lineWidth=2.5;ex.strokeStyle='#5b9dff';ex.stroke();
  if(book){
    ex.beginPath();
    for(let i=0;i<=24;i++){const t=i/24,a=bez(TL,TM,TR,.5),b=bez(BL,BM,BR,.5),p=[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];ex[i?'lineTo':'moveTo'](p[0]*scale,p[1]*scale)}
    ex.setLineDash([6,6]);ex.strokeStyle='#ff9055';ex.stroke();ex.setLineDash([]);
  }
  pts.forEach((p,i)=>{
    if(i>5&&!more)return;
    ex.beginPath();ex.arc(p[0]*scale,p[1]*scale,i<4?12:10,0,7);
    ex.fillStyle=i<4?'#1f5fbf':'#e8590c';ex.fill();
    ex.lineWidth=3;ex.strokeStyle='#fff';ex.stroke();
  });
  loupe();
}
function loupe(){
  if(drag<0||!pts[drag])return;
  const p=pts[drag],R=56,Z=3,cx=p[0]*scale,cy=p[1]*scale;
  let lx=Math.max(R+4,Math.min(ed.width-R-4,cx)),ly=cy-R-48;if(ly<R+4)ly=cy+R+48;
  const sw=2*R/(scale*Z);
  ex.save();ex.beginPath();ex.arc(lx,ly,R,0,7);ex.clip();ex.fillStyle='#000';ex.fillRect(lx-R,ly-R,2*R,2*R);
  ex.drawImage(src,p[0]-sw/2,p[1]-sw/2,sw,sw,lx-R,ly-R,2*R,2*R);ex.restore();
  ex.lineWidth=3;ex.strokeStyle='#fff';ex.beginPath();ex.arc(lx,ly,R,0,7);ex.stroke();
  ex.lineWidth=1.5;ex.strokeStyle='#f3c340';ex.beginPath();ex.moveTo(lx-10,ly);ex.lineTo(lx+10,ly);ex.moveTo(lx,ly-10);ex.lineTo(lx,ly+10);ex.stroke();
}
function pos(e){const r=ed.getBoundingClientRect();return[(e.clientX-r.left)*(ed.width/r.width),(e.clientY-r.top)*(ed.height/r.height)]}
ed.addEventListener('pointerdown',e=>{
  const [x,y]=pos(e);let best=-1,bd=34*34;
  pts.forEach((p,i)=>{if(i>5&&!more)return;const d=(p[0]*scale-x)**2+(p[1]*scale-y)**2;if(d<bd){bd=d;best=i}});
  drag=best;if(drag>=0){ed.setPointerCapture(e.pointerId);draw()}
});
ed.addEventListener('pointermove',e=>{
  if(drag<0)return;const [x,y]=pos(e);
  pts[drag]=[Math.max(0,Math.min(src.width,x/scale)),Math.max(0,Math.min(src.height,y/scale))];draw();
});
['pointerup','pointercancel'].forEach(n=>ed.addEventListener(n,()=>{drag=-1;if(pts.length)draw()}));


function updateBook(){
  if(!pts.length)return;
  if(mode==='2')book=true;else if(mode==='1')book=false;
  else{const a=SC.pageAspect(pts[0],pts[1],pts[2],pts[3],src.width,src.height);book=a>1.12&&a<2.2}
}
const _draw=draw;draw=function(){updateBook();_draw()};

$('rot').onclick=()=>{
  const c=document.createElement('canvas');c.width=src.height;c.height=src.width;
  const x=c.getContext('2d');x.translate(c.width,0);x.rotate(Math.PI/2);x.drawImage(src,0,0);
  src=c;fit();detectNow();
};
$('filters').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;filt=b.dataset.f;
  [...$('filters').children].forEach(c=>c.setAttribute('aria-pressed',c===b));
};
$('modes').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;mode=b.dataset.m;$('guide').hidden=mode!=='2';
  [...$('modes').children].forEach(c=>c.setAttribute('aria-pressed',c===b));
  $('guide').hidden=mode!=='2';
};
async function grabBlob(){
  const t=stream&&stream.getVideoTracks()[0],v=$('vid');
  if(t&&window.ImageCapture){try{return await new ImageCapture(t).takePhoto()}catch(e){}}
  if(stream&&v.videoWidth){const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);return await new Promise(r=>c.toBlob(r,'image/jpeg',.95))}
  return null;
}
$('shut').onclick=async()=>{
  if(!stream){$('camfile').click();return}
  const b=await grabBlob();if(!b){$('camfile').click();return}
  if(autoShot)quickAdd(b);else load(b);
};
$('camMsg').onclick=()=>$('camfile').click();
$('camfile').onchange=e=>{load(e.target.files[0]);e.target.value=''};
$('gal').onchange=e=>{load(e.target.files[0]);e.target.value=''};
$('flash').onclick=async e=>{
  const b=e.currentTarget,t=stream&&stream.getVideoTracks()[0],on=b.getAttribute('aria-pressed')!=='true';
  try{await t.applyConstraints({advanced:[{torch:on}]});b.setAttribute('aria-pressed',on)}catch(err){say('이 기기에서는 플래시를 켤 수 없습니다.')}
};

async function doAdd(){
  if(!src||adding)return;adding=true;
  const my=src;say('페이지를 펴는 중…');
  try{
    await detP;if(src!==my)return;
    if(!pts.length){say('윤곽선을 찾지 못했습니다. 점을 맞춰 주세요.');return}
    updateBook();
    const r=await callCore('process',()=>rgba(my),{pts:pts.map(p=>p.slice()),popt:{filter:filt,mode,flatten:flat}});
    __perf.proc=r.procMs;window.__info=r.info;
    const list=r.pages.map(pageURL);list.forEach(u=>pages.push(u));
    cur().ts=Date.now();persist();
    if(src===my){src=null;disp=null;go('cam')}
    renderAll();say(list.length+'쪽을 '+cur().name+'에 추가했습니다.'+(r.info.sharp<.1?' 사진이 흐릿해요. 다시 찍는 걸 권장합니다.':''));
  }catch(err){say('처리 중 오류가 발생했습니다. 다시 시도해 주세요.')}
  finally{adding=false}
}
$('add').onclick=doAdd;
$('addNext').onclick=()=>{if(!stream)$('camfile').click();doAdd()};
$('cancel').onclick=()=>{src=null;disp=null;go('cam')};
$('more').onclick=e=>{more=!more;e.currentTarget.setAttribute('aria-pressed',more);draw()};
$('flatB').onclick=e=>{flat=!flat;e.currentTarget.setAttribute('aria-pressed',flat)};

// ---- 연속 추가: 카메라를 끄지 않고 백그라운드에서 감지+펴기 ----
let qChain=Promise.resolve(),qN=0;
function quickAdd(blob){
  const f=cur();qN++;say('처리 중… ('+qN+')');
  qChain=qChain.then(async()=>{
    try{
      const c=await toCanvas(blob);
      const r=await callCore('both',()=>rgba(c),{dopt:{},popt:{filter:filt,mode,flatten:flat}});
      __perf.det=r.detMs;__perf.proc=r.procMs;window.__info=r.info;
      r.pages.forEach(q=>f.pages.push(pageURL(q)));f.ts=Date.now();persist();renderAll();
      say(r.pages.length+'쪽을 '+f.name+'에 추가했습니다.'+(!r.det.ok?' (경계를 못 찾아 기본 영역으로 저장)':(r.det.low?' (경계 확신이 낮아요. 폴더에서 확인해 주세요)':'')));
    }catch(e){say('처리 중 오류가 발생했습니다.')}
    finally{qN--}
  });
}

// ---- 라이브 윤곽선 + 안정/초점 판정 자동촬영 ----
$('autoB').onclick=e=>{autoShot=!autoShot;e.currentTarget.setAttribute('aria-pressed',autoShot);say(autoShot&&!stream?'자동 촬영은 카메라 미리보기가 열릴 때만 쓸 수 있습니다.':(autoShot?'자동 촬영 켜짐: 페이지가 멈추고 선명하면 찍어서 바로 추가합니다.':''))};
{
const ov=$('ov'),ox=ov.getContext('2d'),lc=document.createElement('canvas'),fc=document.createElement('canvas');
const L={busy:false,q:null,raw:null,stable:0,lost:0,armed:true,fh:[],sharp:false};window.__live=L;
function lapVar(c){
  const w=c.width,h=c.height,d=c.getContext('2d').getImageData(0,0,w,h).data,g=new Float32Array(w*h);
  for(let i=0;i<w*h;i++)g[i]=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];
  let s=0,s2=0,n=0;
  for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=y*w+x,l=4*g[i]-g[i-1]-g[i+1]-g[i-w]-g[i+w];s+=l;s2+=l*l;n++}
  const m=s/n;return s2/n-m*m;
}
function v2e(p){const v=$('vid'),vw=v.videoWidth,vh=v.videoHeight,W=ov.width,H=ov.height,k=Math.max(W/vw,H/vh);return[(W-vw*k)/2+p[0]*vw*k,(H-vh*k)/2+p[1]*vh*k]}
function paint(){
  const par=ov.parentElement,dpr=window.devicePixelRatio||1,w=Math.round(par.clientWidth*dpr),h=Math.round(par.clientHeight*dpr);
  if(ov.width!==w||ov.height!==h){ov.width=w;ov.height=h}
  ox.clearRect(0,0,ov.width,ov.height);if(!L.q)return;
  const good=L.stable>=2&&L.sharp;
  ox.beginPath();L.q.forEach((p,i)=>{const e=v2e(p);i?ox.lineTo(e[0],e[1]):ox.moveTo(e[0],e[1])});ox.closePath();
  ox.fillStyle=good?'rgba(18,183,155,.16)':'rgba(243,195,64,.12)';ox.fill();
  ox.lineWidth=4*dpr;ox.strokeStyle=good?'#12b79b':'#f3c340';ox.lineJoin='round';ox.stroke();
}
async function tick(){
  const v=$('vid');
  if(document.body.dataset.s!=='cam'||!stream||!v.videoWidth||L.busy||document.hidden){if(!stream||document.body.dataset.s!=='cam'){L.q=null;paint()}return}
  L.busy=true;
  try{
    const vw=v.videoWidth,vh=v.videoHeight,k=224/Math.max(vw,vh),fw=Math.max(8,Math.round(vw*k)),fh=Math.max(8,Math.round(vh*k));
    lc.width=fw;lc.height=fh;lc.getContext('2d').drawImage(v,0,0,fw,fh);
    // focus: variance of Laplacian on the central 60% (400px wide)
    const cw2=400,ch2=Math.round(cw2*vh/vw);fc.width=cw2;fc.height=ch2;
    fc.getContext('2d').drawImage(v,vw*.2,vh*.2,vw*.6,vh*.6,0,0,cw2,ch2);
    const fv=lapVar(fc);L.fh.push(fv);if(L.fh.length>12)L.fh.shift();
    const fmax=Math.max(...L.fh);L.sharp=fv>=.8*fmax&&fv>1;
    const r=await callCore('detect',()=>rgba(lc),{dopt:{refine:false,coarse:224}});
    const d=r.det,area=Math.abs(SC.quadArea(d.pts.slice(0,4)))/(fw*fh);
    if(!d.ok||area<.12){L.q=null;L.raw=null;L.stable=0;if(++L.lost>=3)L.armed=true}
    else{
      L.lost=0;const nq=d.pts.slice(0,4).map(p=>[p[0]/fw,p[1]/fh]),dg=Math.hypot(fw,fh);
      let mv=1;if(L.raw){mv=0;for(let i=0;i<4;i++)mv+=Math.hypot((nq[i][0]-L.raw[i][0])*fw,(nq[i][1]-L.raw[i][1])*fh);mv/=4*dg}
      if(mv<.012)L.stable++;else L.stable=0;
      if(mv>.04)L.armed=true;
      L.q=L.q&&mv<.08?L.q.map((p,i)=>[p[0]*.5+nq[i][0]*.5,p[1]*.5+nq[i][1]*.5]):nq;L.raw=nq;
    }
    paint();
    if(autoShot&&L.armed&&L.stable>=4&&L.sharp&&qN<3){L.armed=false;L.stable=0;$('shut').click()}
  }catch(e){}
  finally{L.busy=false}
}
setInterval(tick,180);
}

// ---- 공유 / 저장 ----
async function deliver(blob,name,mime){
  const dl=await cap('downloads');
  if(dl){try{await dl.save({filename:name,data:blob});return}catch(e){if(e.code==='declined')return}}
  const f=new File([blob],name,{type:mime});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();
}

    z.file('_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
    z.file('word/_rels/document.xml.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+rels+'</Relationships>');

// ---- PDF 가져오기 ----
$('pdfimp').onclick=()=>$('pdfin').click();
$('pdfin').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  if(!window.pdfjsLib){say('PDF 도구를 불러오지 못했습니다. 네트워크를 확인해 주세요.');return}
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const doc=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
    for(let n=1;n<=doc.numPages;n++){
      say('PDF 읽는 중… '+n+'/'+doc.numPages);
      const pg=await doc.getPage(n),v0=pg.getViewport({scale:1}),v=pg.getViewport({scale:Math.min(2,1700/Math.max(v0.width,v0.height))}),c=document.createElement('canvas');
      c.width=v.width;c.height=v.height;await pg.render({canvasContext:c.getContext('2d'),viewport:v}).promise;
      pages.push(c.toDataURL('image/jpeg',.9));
    }
    cur().ts=Date.now();persist();renderAll();say(doc.numPages+'쪽을 가져왔습니다.');
  }catch(err){say('PDF를 가져오지 못했습니다. 다른 파일로 시도해 주세요.')}
};

// ---- 서명 ----
let sgI=-1,sgImg=null,sgPos=[.72,.88],pen=false,mv=false;
const pv=$('pv'),pad=$('pad'),px2=pad.getContext('2d'),pvx=pv.getContext('2d');
function sgDraw(){pvx.clearRect(0,0,pv.width,pv.height);pvx.drawImage(sgImg,0,0,pv.width,pv.height);const w=pv.width*.34,h=w/3;pvx.drawImage(pad,sgPos[0]*pv.width-w/2,sgPos[1]*pv.height-h/2,w,h)}
function openSig(i){
  sgI=i;sgImg=new Image();
  sgImg.onload=()=>{const k=Math.min(1,window.innerHeight*.42/sgImg.height,560/sgImg.width);pv.width=Math.round(sgImg.width*k);pv.height=Math.round(sgImg.height*k);px2.clearRect(0,0,600,200);sgPos=[.72,.88];sgDraw();$('sig').hidden=false};
  sgImg.src=pages[i];
}
const pp=e=>{const r=pad.getBoundingClientRect();return[(e.clientX-r.left)*600/r.width,(e.clientY-r.top)*200/r.height]};
pad.onpointerdown=e=>{pen=true;pad.setPointerCapture(e.pointerId);const[x,y]=pp(e);px2.lineWidth=5;px2.lineCap=px2.lineJoin='round';px2.strokeStyle='#111';px2.beginPath();px2.moveTo(x,y);px2.lineTo(x+.01,y);px2.stroke()};
pad.onpointermove=e=>{if(!pen)return;const[x,y]=pp(e);px2.lineTo(x,y);px2.stroke();sgDraw()};
pad.onpointerup=pad.onpointercancel=()=>{pen=false;sgDraw()};
const pm=e=>{const r=pv.getBoundingClientRect();sgPos=[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height];sgDraw()};
pv.onpointerdown=e=>{mv=true;pv.setPointerCapture(e.pointerId);pm(e)};
pv.onpointermove=e=>{if(mv)pm(e)};pv.onpointerup=()=>{mv=false};
$('sgClr').onclick=()=>{px2.clearRect(0,0,600,200);sgDraw()};
$('sgX').onclick=()=>{$('sig').hidden=true};
$('sgOk').onclick=()=>{
  const c=document.createElement('canvas');c.width=sgImg.width;c.height=sgImg.height;const x=c.getContext('2d');
  x.drawImage(sgImg,0,0);const w=c.width*.34,h=w/3;x.drawImage(pad,sgPos[0]*c.width-w/2,sgPos[1]*c.height-h/2,w,h);
  pages[sgI]=c.toDataURL('image/jpeg',.92);persist();$('sig').hidden=true;renderAll();say('서명을 넣었습니다.');
};


// ---- library / folders ----
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function pic(u,alt){const i=new Image();i.src=u;i.alt=alt||'';return i}
function fmt(ts){return new Date(ts).toLocaleString('ko-KR',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false})}
function openFold(id){setCur(id);$('out').hidden=true;$('out').value='';go('fold')}
function renderAll(){
  const sorted=[...folders].sort((a,b)=>b.ts-a.ts),s=$('fsel');
  s.innerHTML='';folders.forEach(f=>{const o=el('option',null,f.name);o.value=f.id;s.append(o)});s.value=curId;
  const last=pages[pages.length-1],t=$('thumb');t.innerHTML='';if(last)t.append(pic(last,'최근 스캔'));
  const r=$('recent'),all=[];r.innerHTML='';
  sorted.forEach(f=>f.pages.slice().reverse().forEach(u=>all.push({u,id:f.id})));
  all.slice(0,10).forEach(x=>{const b=el('button','rc');b.setAttribute('aria-label','폴더 열기');b.append(pic(x.u,''));b.onclick=()=>openFold(x.id);r.append(b)});
  $('recentWrap').hidden=!all.length;
  $('fcount').textContent='폴더('+folders.length+')';
  const l=$('flist');l.innerHTML='';
  sorted.forEach(f=>{
    const b=el('button','fi'),th=el('div','fth'),lp=f.pages[f.pages.length-1],tx=el('div','ft');
    if(lp)th.append(pic(lp,''));
    tx.append(el('strong',null,f.name),el('span',null,fmt(f.ts)+'  ·  '+f.pages.length+'쪽'));
    b.append(th,tx);b.onclick=()=>openFold(f.id);l.append(b);
  });
  $('ftitle').textContent=cur().name;
  const g=$('grid');g.innerHTML='';
  pages.forEach((u,i)=>{
    const d=el('div','th');d.append(pic(u,(i+1)+'쪽'),el('span',null,i+1));
    const b=el('button',null,'삭제');b.setAttribute('aria-label',(i+1)+'쪽 삭제');
    b.onclick=()=>{pages.splice(i,1);persist();renderAll()};d.append(b);
    const sg=el('button','sgb','서명');sg.onclick=()=>openSig(i);d.append(sg);
    d.firstChild.onclick=()=>showV(i);
    const tb=el('div','tb'),bl=el('button',null,'◀'),br=el('button',null,'▶'),bo=el('button',null,'⟳');
    bl.setAttribute('aria-label',(i+1)+'쪽 앞으로');br.setAttribute('aria-label',(i+1)+'쪽 뒤로');bo.setAttribute('aria-label',(i+1)+'쪽 회전');
    bl.disabled=i===0;br.disabled=i===pages.length-1;
    bl.onclick=()=>movePg(i,-1);br.onclick=()=>movePg(i,1);bo.onclick=()=>rotPg(i);
    tb.append(bl,bo,br);d.append(tb);g.append(d);
  });
  $('emptyMsg').hidden=!!pages.length;
  ['pdf','ocr','clear','imgs','word'].forEach(k=>$(k).disabled=!pages.length);
  $('delFold').hidden=folders.length<2;
}
function movePg(i,dir){const j=i+dir;if(j<0||j>=pages.length)return;[pages[i],pages[j]]=[pages[j],pages[i]];persist();renderAll()}
function rotPg(i){const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=im.height;c.height=im.width;const x=c.getContext('2d');x.translate(c.width,0);x.rotate(Math.PI/2);x.drawImage(im,0,0);pages[i]=c.toDataURL('image/jpeg',.9);persist();renderAll()};im.src=pages[i]}
let vi=0;
function showV(i){vi=Math.max(0,Math.min(pages.length-1,i));$('vwI').src=pages[vi];$('vwN').textContent=(vi+1)+' / '+pages.length;$('vwP').disabled=vi===0;$('vwNx').disabled=vi===pages.length-1;$('vw').hidden=false}
$('vwP').onclick=()=>showV(vi-1);$('vwNx').onclick=()=>showV(vi+1);$('vwX').onclick=()=>{$('vw').hidden=true};
addEventListener('keydown',e=>{if($('vw').hidden)return;if(e.key==='Escape')$('vw').hidden=true;if(e.key==='ArrowLeft')showV(vi-1);if(e.key==='ArrowRight')showV(vi+1)});
function sure(b,label,fn){let t;b.onclick=()=>{
  if(b.dataset.arm){clearTimeout(t);delete b.dataset.arm;b.textContent=label;fn()}
  else{b.dataset.arm=1;b.textContent='한 번 더 누르면 삭제';t=setTimeout(()=>{delete b.dataset.arm;b.textContent=label},3000)}
}}
sure($('clear'),'페이지 모두 지우기',()=>{pages.length=0;persist();renderAll()});
sure($('delFold'),'폴더 삭제',()=>{folders=folders.filter(f=>f.id!==curId);setCur(folders[0].id);persist();go('lib')});
$('fsel').onchange=e=>{setCur(e.target.value);renderAll()};
$('toLib').onclick=()=>go('lib');
$('thumb').onclick=()=>openFold(curId);
$('backCam').onclick=()=>go('cam');
$('backLib').onclick=()=>go('lib');
$('newF').onclick=()=>{renId=null;$('sheet').hidden=false;$('nf').value='';$('nf').focus()};
$('renF').onclick=()=>{renId=curId;$('sheet').hidden=false;$('nf').value=cur().name;$('nf').focus();$('nf').select()};
$('cx').onclick=()=>{$('sheet').hidden=true;renId=null};
$('mk').onclick=()=>{
  const n=$('nf').value.trim();if(!n)return;
  if(folders.some(f=>f.name===n&&f.id!==renId)){say('같은 이름의 폴더가 있습니다.');return}
  if(renId){cur().name=n;renId=null;$('sheet').hidden=true;persist();renderAll();return}
  const f={id:'f'+Date.now(),name:n,ts:Date.now(),pages:[]};folders.push(f);setCur(f.id);
  $('sheet').hidden=true;persist();renderAll();
};

async function cap(n){try{return window.claude?await window.claude.use(n):null}catch(e){return null}}
function toBlob(u){const b=atob(u.split(',')[1]),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new Blob([a],{type:'image/jpeg'})}

$('cpy').onclick=async()=>{
  const o=$('out');if(!o.value){say('복사할 텍스트가 없습니다. 먼저 텍스트를 추출하세요.');return}
  try{await navigator.clipboard.writeText(o.value);say('복사했습니다.')}catch(e){o.select();say('텍스트를 선택했습니다. 길게 눌러 복사하세요.')}
};
$('txt').onclick=async()=>{
  const o=$('out');if(!o.value){say('저장할 텍스트가 없습니다. 먼저 텍스트를 추출하세요.');return}
  const dl=await cap('downloads');
  if(!dl){say('이 환경에서는 파일 저장을 사용할 수 없습니다. 복사 버튼을 이용해 주세요.');return}
  try{await dl.save({filename:'scan.txt',data:o.value});say('저장했습니다.')}catch(e){say(e.code==='declined'?'':'저장하지 못했습니다.')}
};

$('pdf').onclick=async()=>{
  if(!window.jspdf){say('PDF 도구를 불러오지 못했습니다. 네트워크를 확인해 주세요.');return}
  say('PDF를 만드는 중…');
  try{
    const {jsPDF}=window.jspdf;let doc=null;
    for(const u of pages){
      const im=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=u});
      const f=[595,Math.round(595*im.height/im.width)];
      if(!doc)doc=new jsPDF({unit:'pt',format:f,orientation:f[0]>f[1]?'l':'p',compress:true});else doc.addPage(f,f[0]>f[1]?'l':'p');
      doc.addImage(u,'JPEG',0,0,f[0],f[1]);
    }
    const blob=doc.output('blob'),file=new File([blob],'scan.pdf',{type:'application/pdf'});
    const dl=await cap('downloads');
    if(dl){try{await dl.save({filename:'scan.pdf',data:blob});say('PDF를 저장했습니다.');return}catch(e){if(e.code==='declined'){say('');return}}}
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file],title:'스캔 PDF'});say('공유했습니다.');return}catch(e){if(e.name==='AbortError'){say('');return}}
    }
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='scan.pdf';document.body.append(a);a.click();a.remove();
    say('PDF를 저장했습니다.');
  }catch(e){say('PDF를 만들지 못했습니다. 다시 시도해 주세요.')}
};

try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
restore().then(()=>{renderAll();startCam()});
</script>
<script>
(()=>{
let busy=false,pg=0;
$('ocr').onclick=async()=>{
  if(busy)return;
  if(!window.Tesseract){say('OCR 도구를 불러오지 못했습니다. 네트워크를 확인해 주세요.');return}
  busy=true;$('ocr').disabled=true;
  const out=$('out');out.hidden=false;out.value='';
  let w=null;
  try{
    say('한국어 인식 데이터를 불러오는 중… (처음 한 번은 오래 걸립니다)');
    w=await Tesseract.createWorker('kor+eng',1,{logger:m=>{if(m.status==='recognizing text')say(pg+'쪽 읽는 중… '+Math.round(m.progress*100)+'%')}});
    const parts=[];
    for(let i=0;i<pages.length;i++){
      pg=i+1;say(pg+'/'+pages.length+'쪽 읽는 중…');
      const r=await w.recognize(pages[i]);
      parts.push('--- '+pg+'쪽 ---\n'+r.data.text.trim());out.value=parts.join('\n\n');
    }
    say('텍스트 추출을 마쳤습니다.');
  }catch(e){say('텍스트 추출에 실패했습니다. 네트워크를 확인하고 다시 시도해 주세요.')}
  finally{if(w)try{await w.terminate()}catch(e){}busy=false;$('ocr').disabled=!pages.length}
};
$('txt').onclick=async()=>{
  const o=$('out');if(!o.value){say('저장할 텍스트가 없습니다. 먼저 텍스트를 추출하세요.');return}
  await deliver(new Blob([o.value],{type:'text/plain;charset=utf-8'}),'scan.txt','text/plain');
};
})();
</script>
